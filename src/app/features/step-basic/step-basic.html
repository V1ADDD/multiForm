<div class="step-container">
    <h2>Основные данные</h2>
    <form [formGroup]="basicInfoForm" (ngSubmit)="onSubmit()">
        @for (field of fields; track field) {
            @if (field.type !== 'tel' || (field.type==='tel' && showPhoneField)) {
                <app-custom-input
                    formControlName="{{field.name}}"
                    [label]="field.label"
                    [name]="field.name"
                    [type]="field.type"
                    [errorMes]="field.errorMes"
                    [inputMask]="field.type === 'tel' ? 
                                (basicInfoForm.get('country')?.value === 'by' ?
                                '(00) 000-00-00' : '(000) 000-00-00')
                                : undefined"
                    [invalid]="basicInfoForm.get(field.name)?.invalid &&
                                (basicInfoForm.get(field.name)?.dirty ||
                                basicInfoForm.get(field.name)?.touched)
                                "></app-custom-input>
            }
        }
        <div class="navigation-buttons">
            <button 
            type="button" 
            class="btn-secondary" 
            (click)="goBack()">
            Назад
            </button>
            
            <button 
            type="submit" 
            class="btn-primary" 
            [disabled]="!basicInfoForm.valid">
            Далее
            </button>
        </div>
    </form>
</div>
