<div class="step-container">
  <h2>Основные данные</h2>
  <form [formGroup]="basicInfoForm" (ngSubmit)="onSubmit()">
    <app-custom-input
      formControlName="email"
      [label]="'Email'"
      [name]="'email'"
      [type]="'email'"
      [errorMes]="getErrorMessage('email')"
      [invalid]="
        basicInfoForm.get('email')?.invalid &&
        (basicInfoForm.get('email')?.dirty || basicInfoForm.get('email')?.touched)
      "
    ></app-custom-input>

    <app-custom-input
      formControlName="name"
      [label]="'Имя'"
      [name]="'name'"
      [type]="'text'"
      [errorMes]="getErrorMessage('name')"
      [invalid]="
        basicInfoForm.get('name')?.invalid &&
        (basicInfoForm.get('name')?.dirty || basicInfoForm.get('name')?.touched)
      "
    ></app-custom-input>

    <app-custom-input
      formControlName="country"
      [label]="'Страна'"
      [name]="'country'"
      [type]="'select'"
      [errorMes]="getErrorMessage('country')"
      [invalid]="
        basicInfoForm.get('country')?.invalid &&
        (basicInfoForm.get('country')?.dirty || basicInfoForm.get('country')?.touched)
      "
    ></app-custom-input>

    @if (showPhoneField) {
      <app-custom-input
        formControlName="phone"
        [label]="'Телефон'"
        [name]="'phone'"
        [type]="'tel'"
        [errorMes]="getErrorMessage('phone')"
        [inputMask]="
          basicInfoForm.get('country')?.value === 'by' ? '(00) 000-00-00' : '(000) 000-00-00'
        "
        [invalid]="
          basicInfoForm.get('phone')?.invalid &&
          (basicInfoForm.get('phone')?.dirty || basicInfoForm.get('phone')?.touched)
        "
      ></app-custom-input>
    }

    <div class="navigation-buttons">
      <button type="button" class="btn-secondary" (click)="goBack()">Назад</button>

      <button type="submit" class="btn-primary" [disabled]="!basicInfoForm.valid">Далее</button>
    </div>
  </form>
</div>
