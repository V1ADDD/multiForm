<div class="step-container">

  <h2>Выберите способ регистрации</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="method-options">

      <div
        class="method-card"
        [class.selected]="form.get('method')?.value === 'email'"
        (click)="selectMethod('email')"
        (keydown.enter)="selectMethod('email')"
        (keydown.space)="selectMethod('email')"
        tabindex="0"
        role="button"
      >
        <div class="method-icon">📧</div>
        <h3>Email</h3>
        <p>Регистрация с помощью email</p>
      </div>

      <div
        class="method-card"
        [class.selected]="form.get('method')?.value === 'social'"
        (click)="selectMethod('social')"
        (keydown.enter)="selectMethod('social')"
        (keydown.space)="selectMethod('social')"
        tabindex="0"
        role="button"
      >
        <div class="method-icon">🌐</div>
        <h3>Социальные сети</h3>
        <p>Быстрая регистрация через социальные сети</p>
      </div>

    </div>

    <input type="hidden" formControlName="method" />
    
    @if (form.get('method')?.value === 'social') {
    <div class="social-buttons">
      <p>Выберите социальную сеть:</p>
      <div class="social-options">
        <button type="submit" class="social-btn google">
          <span class="social-icon">🤖</span>Google
        </button>

        <button type="submit" class="social-btn meta">
          <span class="social-icon">Ⓜ️</span>Meta
        </button>
        
        <button type="submit" class="social-btn github">
          <span class="social-icon">👨🏻‍💻</span>Github
        </button>
      </div>
    </div>
    } 
    
    @if (form.get('method')?.value === 'email') {
    <div class="navigation">
      <button type="submit" class="btn-primary" [disabled]="!form.valid">
        Продолжить с Email
      </button>
    </div>
    }
    
  </form>
</div>
